version: "3"
services:
  mm-postgres:
    image: postgres:15.3-alpine
    restart: always
    environment:
      - POSTGRES_USER=membermatters
      - POSTGRES_PASSWORD=membermatters
      - POSTGRES_DB=membermatters
    ports:
      - "5432:5432"
    volumes:
      - mm-postgres-volume:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U membermatters"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MemberMatters Redis
  mm-redis:
    image: redis
    restart: always
    depends_on:
      - mm-postgres
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data

  # MemberMatters
  mm-webapp:
    image: membermatters/membermatters
    restart: always
    environment:
      MM_ENV: "Production"
      MM_SECRET_KEY: "CHANGE_ME"
      MM_USE_POSTGRES: True
      MM_REDIS_HOST: "redis://mm-redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      - mm-postgres
      - mm-redis
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # nginx's Debian defaults need a few scratch dirs outside of the app's
      # own volumes (proxy/fastcgi/scgi/uwsgi temp dirs live under here).
      # uid/gid 999 is the non-root "mm" user set up in docker/Dockerfile.
      - /var/lib/nginx:uid=999,gid=999
      - /var/log/nginx:uid=999,gid=999
      # large file uploads spill from memory to disk via Python's tempfile
      - /tmp:uid=999,gid=999
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 15

  # MemberMatters Celery Worker
  mm-celery-worker:
    image: membermatters/membermatters
    restart: always
    environment:
      MM_ENV: "Production"
      MM_USE_POSTGRES: True
      MM_RUN_MODE: "celery_worker"
      MM_REDIS_HOST: "redis://mm-redis:6379/0"
    depends_on:
      - mm-webapp
      - mm-redis
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # billiard's prefork pool needs a writable tempdir to start at all
      - /tmp:uid=999,gid=999

  # MemberMatters Celery Beat
  mm-celery-beat:
    image: membermatters/membermatters
    restart: always
    environment:
      MM_ENV: "Production"
      MM_USE_POSTGRES: True
      MM_RUN_MODE: "celery_beat"
      MM_REDIS_HOST: "redis://mm-redis:6379/0"
    depends_on:
      - mm-webapp
      - mm-celery-worker
      - mm-redis
    security_opt:
      - no-new-privileges:true
    read_only: true

  mm-celery-prom-exporter:
    image: danihodovic/celery-exporter
    restart: always
    environment:
      CE_BROKER_URL: "redis://mm-redis:6379/0"
    depends_on:
      - mm-celery-worker
      - mm-redis
    security_opt:
      - no-new-privileges:true
    read_only: true

volumes:
  mm-postgres-volume:
    driver: local
