name: Build Docker Image (On Dev Push)

on:
  workflow_dispatch:
  push:
    branches:
      - "dev"


jobs:
  build-docker-dev:
    runs-on: ubuntu-latest
    steps:
#      - name: Set up QEMU
#        uses: docker/setup-qemu-action@27d0a4f181a40b142cce983c5393082c365d1480 # v1
#      - name: Set up Docker Buildx
#        uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1
      - name: Login to DockerHub
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          registry: gitea.makeroanoke.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and Push
        id: docker_build
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3
        with:
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: gitea.makeroanoke.org/critical-services/membermatters:dev,gitea.makeroanoke.org/critical-services/membermatters:${{github.sha}}
