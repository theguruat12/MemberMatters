name: Upload Docker Image (On PR - after build)

on:
  workflow_run:
    workflows: ["Build Docker Image (On PR)"]
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  upload-docker-pr:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    outputs:
      imagename: ${{ steps.extract_image_name.outputs.imagename }}
      prnumber: ${{ steps.extract_pr_number.outputs.prnumber }}
    steps:
      - name: Download PR Image
        uses: actions/github-script@v7
        with:
          script: |
            var artifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: ${{github.event.workflow_run.id }},
            });
            var matchArtifact = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "pr"
            })[0];
            var download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            var fs = require('fs');
            fs.writeFileSync('${{github.workspace}}/pr.zip', Buffer.from(download.data));
      - name: Unzip PR Image
        run: |
          unzip pr.zip
      # The metadata files below originate from an untrusted PR build, so they
      # must be validated before use. We never interpolate their contents into
      # a shell or script body; instead we anchor them to a strict expected
      # shape and fail the run otherwise. This prevents command/markup
      # injection and ensures we can only ever push to the expected repository.
      - name: Extract and validate image name
        shell: bash
        run: |
          imagename=$(cat ./imagename)
          if [[ ! "$imagename" =~ ^kriffe/makersofsweden-membermatters-fork:untrusted-pr-image-[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Refusing untrusted image name from PR artifact: $imagename"
            exit 1
          fi
          echo "imagename=$imagename" >> "$GITHUB_OUTPUT"
        id: extract_image_name
      - name: Extract and validate PR number
        shell: bash
        run: |
          prnumber=$(cat ./prnumber)
          if [[ ! "$prnumber" =~ ^[0-9]+$ ]]; then
            echo "::error::Refusing untrusted PR number from PR artifact: $prnumber"
            exit 1
          fi
          echo "prnumber=$prnumber" >> "$GITHUB_OUTPUT"
        id: extract_pr_number
      - name: Load PR Image
        run: |
          docker load --input ./untrusted-pr-image.tar
          docker image ls -a

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push docker image to DockerHub
        env:
          IMAGE_NAME: ${{ steps.extract_image_name.outputs.imagename }}
        run: docker push "$IMAGE_NAME"
  comment_docker_image:
    needs: upload-docker-pr
    runs-on: ubuntu-latest
    steps:
      - name: Comment name of docker image
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.upload-docker-pr.outputs.prnumber }}
          IMAGE_NAME: ${{ needs.upload-docker-pr.outputs.imagename }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Created image with name \`${process.env.IMAGE_NAME}\`. WARNING: run this image at your own risk - it was created from a potentially untrusted PR.`
            })
