name: Wrong Branch Warning

# Uses pull_request_target so the GITHUB_TOKEN has write access even for
# PRs from forks (a plain pull_request token is read-only for forks, which
# is exactly the case these warnings target). This is safe here because the
# workflow never checks out or executes PR code - it only runs github-script
# with static strings.
on:
  workflow_dispatch:
  pull_request_target:
    types: [opened]
    branches:
      - "main"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # External contributor opened a PR from a fork directly against main.
  comment_warning:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment warning about the wrong target branch
        uses: actions/github-script@v7
        with:
          script: |
            const output = `
            Warning: we only accept PRs to the \`dev\` branch. It looks like you've created a PR to the \`main\` branch. Please edit this PR and select the \`dev\` branch as the target branch instead. If this was intentional please ignore this message.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # Internal PR against main from a branch other than dev.
  comment_warning_internal_pr:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment warning about the wrong source branch
        uses: actions/github-script@v7
        with:
          script: |
            const output = `
            Warning: we only accept PRs to main from the \`dev\` branch. It looks like you've created a PR from a different branch. Please edit this PR and select the \`dev\` branch as the source branch instead. If this was intentional please ignore this message.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
