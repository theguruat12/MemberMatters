name: Django Unit Tests

on: [pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: pip install -r memberportal/requirements.txt

      - name: Run unit tests
        working-directory: memberportal
        env:
          MM_DB_LOCATION: /tmp/db.sqlite3
          MM_LOG_LOCATION: /tmp/django.log
        run: python -m pytest
